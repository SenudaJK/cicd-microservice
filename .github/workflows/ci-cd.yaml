name: CI-CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main

env:
  IMAGE_NAME: microservice

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd cicd-microservice
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd cicd-microservice
          echo "Running tests"
          pytest tests/

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          cd cicd-microservice
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

  push:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          cd cicd-microservice
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker tag $IMAGE_NAME:${{ github.sha }} ghcr.io/senudajk/$IMAGE_NAME:${{ github.sha }}
          docker push ghcr.io/senudajk/$IMAGE_NAME:${{ github.sha }}

  deploy-dev:
    needs: push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest

      - name: Build image for deployment
        run: |
          cd cicd-microservice
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Load image into Minikube
        run: |
          minikube image load $IMAGE_NAME:${{ github.sha }}
          minikube image load ghcr.io/senudajk/$IMAGE_NAME:${{ github.sha }} || true

      - name: Set image tag in deployment
        run: |
          cd cicd-microservice
          sed -i "s|ghcr.io/senudajk/microservice:IMAGE_TAG|$IMAGE_NAME:${{ github.sha }}|g" k8s/dev/deployment.yaml

      - name: Deploy to Minikube cluster
        run: |
          cd cicd-microservice
          kubectl apply -f k8s/dev/
          kubectl rollout status deployment/microservice -n default --timeout=2m || true

      - name: Show service status
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments
          echo ""
          echo "=== Service Status ==="
          kubectl get services
          echo ""
          echo "=== Pods Status ==="
          kubectl get pods
          echo ""
          echo "Note: Service is running in GitHub Actions and not directly accessible."
          echo "To view locally, run Minikube on your machine and use: minikube service microservice-service"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest

      - name: Build image for deployment
        run: |
          cd cicd-microservice
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Load image into Minikube
        run: |
          minikube image load $IMAGE_NAME:${{ github.sha }}

      - name: Set image tag in deployment
        run: |
          cd cicd-microservice
          sed -i "s|ghcr.io/senudajk/microservice:IMAGE_TAG|$IMAGE_NAME:${{ github.sha }}|g" k8s/prod/deployment.yaml

      - name: Deploy to Minikube cluster
        run: |
          cd cicd-microservice
          kubectl apply -f k8s/prod/
          kubectl rollout status deployment/microservice -n default --timeout=2m || true

      - name: Show service status
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments
          echo ""
          echo "=== Service Status ==="
          kubectl get services
          echo ""
          echo "=== Pods Status ==="
          kubectl get pods
          echo ""
          echo "Note: Service is running in GitHub Actions and not directly accessible."
          echo "To view locally, run Minikube on your machine and use: minikube service microservice-service"

